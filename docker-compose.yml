services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workouts_db}
      POSTGRES_USER: ${POSTGRES_USER:-workout_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workout_user} -d ${POSTGRES_DB:-workouts_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Sin "ports": la base solo se necesita en la red interna de Compose.

  backend:
    build:
      context: ./workouts_udec_backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      POSTGRES_SERVER: database
      POSTGRES_USER: ${POSTGRES_USER:-workout_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-workouts_db}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/docs', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      # Opcional: expone la API/Swagger directo para depurar.
      - "8080:8000"

  frontend:
    build:
      context: ./workouts_udec_frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
