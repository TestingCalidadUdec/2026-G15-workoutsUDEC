server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El backend se llama "backend" por nombre de servicio de Compose,
    # así el navegador solo habla con este origen y no hay que lidiar con CORS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html,
    # para que React Router maneje el enrutamiento del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
